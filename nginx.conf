server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8080;
        proxy_pass $backend$request_uri;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
